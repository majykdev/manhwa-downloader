app = "asura-downloader"
primary_region = "iad"

[build]

[mounts]
  source = "data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
