services:
  - type: web
    name: asura-downloader
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CHAPTER_DELAY_MS
        value: 400
      - key: IMAGE_PARALLELISM
        value: 4
      - key: PDF_MAX_PAGE_WIDTH
        value: 800
      - key: JOB_TTL_MS
        value: 3600000
